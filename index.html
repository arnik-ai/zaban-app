  g.fill();
  g.textAlign = "center"; g.fillStyle = "#1E2233";
  g.direction = "rtl"; g.font = "800 32px Vazirmatn"; g.fillText("سطح زبان من", 270, 340);
  g.direction = "ltr"; g.font = "900 62px Vazirmatn"; g.fillStyle = "#16A06B"; g.fillText(t.level || "Intermediate", 270, 440);
  g.fillStyle = "#5841C4"; g.font = "800 30px Vazirmatn"; g.fillText("CEFR " + (t.cefr || "B1"), 270, 495);
  g.direction = "rtl"; g.fillStyle = "#1E2233"; g.font = "900 36px Vazirmatn"; g.fillText("آموزشگاه زبان شما", 270, 620);
  g.font = "700 26px Vazirmatn"; g.fillStyle = "#6C7088"; g.fillText("تو هم سطحت رو بسنج", 270, 820);
  sheet(`<b style="font-size:17px">استوری تو</b><div class="hint">داخل تلگرام با یه لمس تو استوری‌ت می‌ره، با لینک اپ.</div>
    <img src="${cv.toDataURL("image/png")}" alt="کارت استوری سطح زبان" style="display:block;width:58%;margin:14px auto;border-radius:20px;box-shadow:var(--shadow)">
    <button class="btn" type="button" data-act="close" style="width:100%">باشه</button>`);
}

document.addEventListener("click", async (e) => {
  const el = e.target.closest("button"); if (!el) return;
  const d = el.dataset;
  if (d.go) return go(d.go);
  if (d.act === "back") return onBack();
  if (d.act === "close") return closeSheet();
  if (d.course) { haptic("light"); return courseSheet(d.course); }
  if (d.cm) { state.calc.mode = d.cm; haptic("light"); return courseSheet(currentSheet()); }
  if (d.cx) { state.calc[d.cx] = !state.calc[d.cx]; haptic("light"); return courseSheet(currentSheet()); }
  if (d.teen) { state.calc.teen = Math.min(20, Math.max(1, state.calc.teen + Number(d.teen))); haptic("light"); return courseSheet("teen"); }
  if (d.ses) { state.calc.sessions = Math.min(40, Math.max(5, state.calc.sessions + Number(d.ses))); haptic("light"); return courseSheet("private"); }
  if (d.reg) { state.reg.course = d.reg; if (d.tl) state.calc.teen = Number(d.tl); state.reg.mode = state.calc.mode; store.set("reg", state.reg); return go("register"); }
  if (d.day || d.time || d.rm) { readReg(); if (d.day) state.reg.day = d.day; if (d.time) state.reg.time = d.time; if (d.rm) state.reg.mode = d.rm; store.set("reg", state.reg); haptic("light"); return render(); }
  if (d.td) { state.trial.date = d.td; haptic("light"); return render(); }
  if (d.tt) { state.trial.time = d.tt; haptic("light"); return render(); }
  if (d.who) { state.test = { who: d.who, i: 0, ans: [] }; store.set("test", state.test); haptic("light"); return render(); }
  if (d.ans !== undefined) {
    const t = state.test; t.ans[t.i] = Number(d.ans); t.i += 1; haptic("light");
    if (t.i >= QUIZ.length) { t.score = QUIZ.reduce((s, q, i) => s + (t.ans[i] === q.a ? 1 : 0), 0); const l = levelFor(t.score); t.level = l.name; t.cefr = l.cefr; t.done = true; haptic("ok"); }
    store.set("test", t); return render();
  }
  if (d.q) { state.q = d.q; return render(); }
  if (d.copy) { try { await navigator.clipboard.writeText(d.copy); toast("کپی شد"); } catch (err) { toast(fa(d.copy)); } return; }
  switch (d.act) {
    case "contact":
      if (IN_TG && tg.requestContact) tg.requestContact((ok, res) => { const p = ok && res && res.responseUnsafe && res.responseUnsafe.contact && res.responseUnsafe.contact.phone_number; if (p) { $("#ph").value = p; haptic("ok"); } });
      else { $("#ph").value = "09123456789"; toast("داخل تلگرام شماره‌ی خودت با یه لمس میاد (نمونه پر شد)."); }
      return;
    case "homescreen": if (IN_TG && tg.addToHomeScreen) tg.addToHomeScreen(); else toast("داخل تلگرام، آیکون آموزشگاه روی صفحه‌ی گوشی میاد."); return;
    case "retest": state.test = { who: "", i: 0, ans: [] }; store.set("test", state.test); return render();
    case "story": return story();
  }
});
/* Inside Telegram: follow the user's theme. */
if (tg && tg.colorScheme) document.documentElement.dataset.theme = tg.colorScheme === "dark" ? "dark" : "light";
if (tg) { try { const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg1").trim(); tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } catch (e) {} }
render();
</script>
</body>
</html>
